<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>健身系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --ink:#39413A; --muted:#8B948B;
  --sage:#9CAF97; --sage-deep:#6E8468; --sage-soft:#E4EBE1;
  --wist:#A99BC4; --wist-soft:#EDE9F4; --amber:#D9A96B; --line:#E4E8E1;
  --r:16px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:26px;letter-spacing:.5px}
.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.page{display:none;padding:22px var(--pad) 12px;max-width:560px;margin:0 auto}
.page.active{display:block}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(57,65,58,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.wist.on{background:var(--wist);border-color:var(--wist)}
button{font:inherit;cursor:pointer;border:none}
.btn{background:var(--sage);color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;width:100%}
.btn:active{background:var(--sage-deep)}
.btn.ghost{background:var(--sage-soft);color:var(--sage-deep)}
input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;background:#FBFCFA;width:100%}
input:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--sage)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* ===== 今日:動作卡 ===== */
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exname{font-size:17px;font-weight:600}
.exmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;padding:2.5px 9px;border-radius:99px;background:var(--sage-soft);color:var(--sage-deep);white-space:nowrap}
.tag.wist{background:var(--wist-soft);color:#7A6C99}
.hint{margin-top:9px;font-size:13px;color:var(--sage-deep);background:var(--sage-soft);
  border-radius:10px;padding:7px 11px}
.hint.up{color:#7A6C99;background:var(--wist-soft)}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.setn{font-size:13px;color:var(--muted);text-align:center}
.set input{text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums}
.tick{width:46px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.tick svg{width:19px;height:19px;stroke:#C6CDC5;transition:stroke .18s}
.tick.done{background:var(--sage);border-color:var(--sage)}
.tick.done svg{stroke:#fff}
.exnote{margin-top:9px}
.listitem{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:none}
.li-body{flex:1;min-width:0}
.li-name{font-size:15px}
.li-sub{font-size:12px;color:var(--muted)}
.playbtn{width:34px;height:34px;border-radius:10px;background:var(--wist-soft);color:#7A6C99;
  display:flex;align-items:center;justify-content:center;text-decoration:none;flex:0 0 auto;font-size:13px}
.playbtn.off{opacity:.3;pointer-events:none}
.smalltick{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);flex:0 0 auto;background:#fff}
.smalltick.done{background:var(--sage);border-color:var(--sage)}
/* ===== check-in ===== */
.dots{display:flex;gap:7px}
.dot{width:30px;height:30px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:13px}
.dot.on{background:var(--wist);border-color:var(--wist);color:#fff}
/* ===== 儀表板 ===== */
.chartcard canvas{width:100%!important;height:210px!important}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 10px;text-align:center}
.kpi b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:11px;color:var(--muted)}
/* ===== 導航 ===== */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:10.5px;letter-spacing:1px;padding:2px 12px;border-radius:12px}
nav button.on{color:var(--sage-deep)}
nav button svg{width:22px;height:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.datesub{font-size:13px;color:var(--muted);margin-top:2px}
.gear{background:none;color:var(--muted);font-size:20px;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:99px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
.toast.show{opacity:.95}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 0}
.sec{margin:20px 0 8px}
.notecat{font-size:12px;color:#7A6C99;letter-spacing:1.5px;margin:12px 0 5px}
.noteline{font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink)}
details summary{cursor:pointer;font-size:15px;font-weight:600;list-style:none}
details summary::after{content:'＋';float:right;color:var(--muted)}
details[open] summary::after{content:'－'}
#setup{position:fixed;inset:0;background:var(--bg);z-index:100;padding:40px 24px;display:none}
#setup.show{display:block}
.searchrow{display:flex;gap:8px;margin-bottom:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ===== 今日 ===== -->
<section class="page active" id="p-today">
  <div class="topbar">
    <div><div class="eyebrow" id="today-eyebrow">TODAY</div><h1>今日</h1><div class="datesub" id="today-date"></div></div>
    <button class="gear" onclick="openSetup()" aria-label="設定">⚙︎</button>
  </div>
  <div class="chips" id="daychips"></div>
  <div id="checkin-slot"></div>
  <div id="today-body"></div>
</section>

<!-- ===== 恢復 ===== -->
<section class="page" id="p-recover">
  <div class="topbar"><div><div class="eyebrow">RECOVERY</div><h1>恢復</h1><div class="datesub">回家後・睡前</div></div></div>
  <div class="chips" id="recchips"></div>
  <div id="rec-body"></div>
</section>

<!-- ===== 儀表板 ===== -->
<section class="page" id="p-dash">
  <div class="topbar"><div><div class="eyebrow">DASHBOARD</div><h1>儀表板</h1><div class="datesub">看趨勢,不看單日</div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="card chartcard"><div class="eyebrow">體重・7日均線</div><canvas id="c-weight"></canvas></div>
  <div class="card chartcard"><div class="eyebrow">指標動作・力量趨勢</div><canvas id="c-strength"></canvas></div>
  <div class="card chartcard"><div class="eyebrow">每週出席</div><canvas id="c-attend"></canvas></div>
  <div class="card chartcard"><div class="eyebrow">飲食・週均</div><canvas id="c-food"></canvas></div>
</section>

<!-- ===== 動作庫 ===== -->
<section class="page" id="p-lib">
  <div class="topbar"><div><div class="eyebrow">LIBRARY</div><h1>動作庫</h1></div></div>
  <div class="card"><details id="notesbox"><summary>訓練原則速查卡</summary><div id="notes-body"></div></details></div>
  <div class="searchrow"><input id="libsearch" placeholder="搜尋動作…" oninput="renderLib()"></div>
  <div class="chips" id="libchips"></div>
  <div class="card" id="lib-body"></div>
</section>

<nav>
  <button id="nav-today" class="on" onclick="go('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>今日</button>
  <button id="nav-recover" onclick="go('recover')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A8.7 8.7 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>恢復</button>
  <button id="nav-dash" onclick="go('dash')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2"/></svg>儀表板</button>
  <button id="nav-lib" onclick="go('lib')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>動作庫</button>
</nav>

<div class="toast" id="toast"></div>

<!-- ===== 設定 ===== -->
<div id="setup">
  <div class="eyebrow">SETUP</div><h1>連線設定</h1>
  <div class="card" style="margin-top:16px">
    <label>Apps Script 網頁應用程式網址</label>
    <input id="cfg-url" placeholder="https://script.google.com/macros/s/…/exec">
    <div style="height:10px"></div>
    <label>Token(與 Code.gs 內一致)</label>
    <input id="cfg-token" placeholder="CHANGE_ME_…">
    <div style="height:14px"></div>
    <button class="btn" onclick="saveSetup()">儲存並連線</button>
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="document.getElementById('setup').classList.remove('show')">關閉</button>
  </div>
  <div class="empty">設定存在這支手機的瀏覽器裡,只需填一次。</div>
</div>

<script>
/* ================= 狀態 ================= */
const LS='fitv2.';
let DB={library:[],plan:[],logs:[],checkins:[],notes:[]};
let dayType=null;           // 推日/拉日/腿日/休息日
let charts={};
const INDICATORS=['EX041','EX042','EX051','EX050','EX052','EX060','EX061'];
const todayStr=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});

/* ================= 啟動 ================= */
init();
async function init(){
  const cached=localStorage.getItem(LS+'db');
  if(cached){try{DB=JSON.parse(cached);}catch(e){}}
  paintDate();buildDayChips();
  if(!cfg('url')){openSetup();}
  renderAll();
  await refresh();          // 背景更新
  flushQueue();
}
function cfg(k){return localStorage.getItem(LS+k)||'';}
function openSetup(){
  document.getElementById('cfg-url').value=cfg('url');
  document.getElementById('cfg-token').value=cfg('token');
  document.getElementById('setup').classList.add('show');
}
async function saveSetup(){
  localStorage.setItem(LS+'url',document.getElementById('cfg-url').value.trim());
  localStorage.setItem(LS+'token',document.getElementById('cfg-token').value.trim());
  document.getElementById('setup').classList.remove('show');
  toast('已儲存,連線中…');await refresh();
}
async function refresh(){
  if(!cfg('url'))return;
  try{
    const r=await fetch(cfg('url')+'?token='+encodeURIComponent(cfg('token')));
    const j=await r.json();
    if(!j.ok)throw new Error(j.error);
    DB=j;localStorage.setItem(LS+'db',JSON.stringify(j));
    renderAll();toast('資料已同步');
  }catch(e){toast('離線模式(用快取資料)');}
}
/* 寫入(含離線佇列) */
async function post(payload){
  payload.token=cfg('token');
  try{
    const r=await fetch(cfg('url'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const j=await r.json();if(!j.ok)throw 0;return true;
  }catch(e){
    const q=JSON.parse(localStorage.getItem(LS+'queue')||'[]');q.push(payload);
    localStorage.setItem(LS+'queue',JSON.stringify(q));
    toast('已暫存,連線後自動補送');return false;
  }
}
async function flushQueue(){
  let q=JSON.parse(localStorage.getItem(LS+'queue')||'[]');if(!q.length||!cfg('url'))return;
  const rest=[];
  for(const p of q){try{
    const r=await fetch(cfg('url'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});
    const j=await r.json();if(!j.ok)rest.push(p);
  }catch(e){rest.push(p);}}
  localStorage.setItem(LS+'queue',JSON.stringify(rest));
  if(q.length&&!rest.length)toast('離線紀錄已補送 ✓');
}

/* ================= 導航 ================= */
function go(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('on');
  if(p==='dash')renderDash();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function paintDate(){
  const d=new Date();const w='日一二三四五六'[d.getDay()];
  document.getElementById('today-date').textContent=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 週${w}`;
}

/* ================= 今日:日別選擇 ================= */
function suggestDay(){
  const order=['推日','拉日','腿日'];
  const days=DB.logs.map(l=>({d:l['日期'],id:l['動作ID']})).sort((a,b)=>b.d.localeCompare(a.d));
  for(const rec of days){
    const p=DB.plan.find(r=>String(r['動作ID']).includes(rec.id)&&order.includes(r['訓練日']));
    if(p)return order[(order.indexOf(p['訓練日'])+1)%3];
  }
  return '推日';
}
function buildDayChips(){
  const wrap=document.getElementById('daychips');wrap.innerHTML='';
  if(!dayType)dayType=suggestDay();
  ['推日','拉日','腿日','休息日'].forEach(d=>{
    const b=document.createElement('button');b.className='chip'+(d===dayType?' on':'');b.textContent=d;
    b.onclick=()=>{dayType=d;buildDayChips();renderToday();renderRecover();};wrap.appendChild(b);
  });
}

/* ================= 資料工具 ================= */
const lib=id=>DB.library.find(x=>x['動作ID']===id)||{};
function lastSession(id){
  const rows=DB.logs.filter(l=>l['動作ID']===id);if(!rows.length)return null;
  const d=rows.map(r=>r['日期']).sort().pop();
  return {date:d,sets:rows.filter(r=>r['日期']===d).sort((a,b)=>a['第幾組']-b['第幾組'])};
}
function repBounds(str){const m=String(str).match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m)return[+m[1],+m[2]];const n=String(str).match(/(\d+)/);return n?[+n[1],+n[1]]:[8,12];}
function increment(id){return String(lib(id)['設備需求']||'').includes('啞鈴')?1:2.5;}
function pickRotation(planRow){
  const ids=String(planRow['動作ID']).split('/').map(s=>s.trim());
  if(ids.length<2)return{id:ids[0],idx:0};
  // 找兩者中最近一次做的,選另一個
  let last=null,lastIdx=-1;
  ids.forEach((id,i)=>{const s=lastSession(id);if(s&&(!last||s.date>last)){last=s.date;lastIdx=i;}});
  const idx=lastIdx<0?0:(lastIdx+1)%ids.length;
  return{id:ids[idx],idx};
}

/* ================= 今日:渲染 ================= */
function renderAll(){buildDayChips();renderCheckin();renderToday();renderRecover();renderLibChips();renderLib();renderNotes();}

function renderCheckin(){
  const t=todayStr();
  const row=DB.checkins.find(c=>c['日期']===t)||{};
  const q=+row['睡眠品質(1-5)']||0;
  document.getElementById('checkin-slot').innerHTML=`
  <div class="card">
    <div class="eyebrow">DAILY CHECK-IN</div>
    <div class="grid3" style="margin-top:6px">
      <div><label>體重 kg</label><input id="ci-w" type="number" inputmode="decimal" step="0.1" value="${row['早晨體重kg']||''}"></div>
      <div><label>睡眠 h</label><input id="ci-s" type="number" inputmode="decimal" step="0.5" value="${row['睡眠時數']||''}"></div>
      <div><label>步數</label><input id="ci-st" type="number" inputmode="numeric" value="${row['步數(選填)']||''}"></div>
    </div>
    <div style="height:10px"></div>
    <label>睡眠品質</label>
    <div class="dots" id="ci-q">${[1,2,3,4,5].map(n=>`<button class="dot${n<=q?' on':''}" data-n="${n}">${n}</button>`).join('')}</div>
    <div style="height:10px"></div>
    <div class="grid2">
      <div><label>估計熱量 kcal</label><input id="ci-k" type="number" inputmode="numeric" value="${row['估計熱量kcal']||''}"></div>
      <div><label>蛋白質 g</label><input id="ci-p" type="number" inputmode="numeric" value="${row['估計蛋白質g']||''}"></div>
    </div>
    <div style="height:10px"></div>
    <label>身體備註</label><input id="ci-n" value="${row['身體備註']||''}" placeholder="肩緊、經期、聚餐…">
    <div style="height:12px"></div>
    <button class="btn" onclick="saveCheckin()">儲存 check-in</button>
  </div>`;
  document.querySelectorAll('#ci-q .dot').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#ci-q .dot').forEach(x=>x.classList.toggle('on',+x.dataset.n<=+b.dataset.n));});
}
async function saveCheckin(){
  const qOn=document.querySelectorAll('#ci-q .dot.on').length;
  const row={'日期':todayStr(),'早晨體重kg':val('ci-w'),'睡眠時數':val('ci-s'),
    '睡眠品質(1-5)':qOn||'','估計熱量kcal':val('ci-k'),'估計蛋白質g':val('ci-p'),
    'CycleDay':'','步數(選填)':val('ci-st'),'身體備註':val('ci-n')};
  // 樂觀更新本地
  const i=DB.checkins.findIndex(c=>c['日期']===row['日期']);
  if(i>=0)Object.keys(row).forEach(k=>{if(row[k]!=='')DB.checkins[i][k]=row[k];});
  else DB.checkins.push(row);
  localStorage.setItem(LS+'db',JSON.stringify(DB));
  toast('Check-in 已儲存');
  await post({action:'checkin',row});
}
const val=id=>document.getElementById(id).value.trim();

function renderToday(){
  const body=document.getElementById('today-body');body.innerHTML='';
  const rows=DB.plan.filter(r=>r['訓練日']===dayType);
  if(dayType==='休息日'){
    body.appendChild(checklistCard('居家全身循環(選做)',
      DB.library.filter(x=>x['動作類型']==='居家'),'每動作30秒・一輪15-20分鐘'));
    return;
  }
  if(!rows.length){body.innerHTML='<div class="empty">課表配置分頁沒有這一天的內容</div>';return;}
  rows.forEach(r=>{
    const seg=r['段位']||'';
    if(seg==='熱身'){
      const ids=expandRange(r['動作ID']);
      body.appendChild(checklistCard('熱身・選 3-4 個',ids.map(lib).filter(x=>x['動作ID']),r['備註']||''));
    }else if(seg==='核心啟動'){
      const ids=String(r['動作ID']).split('/').map(s=>s.trim());
      body.appendChild(checklistCard('核心啟動',ids.map(lib).filter(x=>x['動作ID']),`${r['組數']} 組・${r['次數']}`));
    }else{
      body.appendChild(exerciseCard(r));
    }
  });
}
function expandRange(s){ // "EX010-016" → [EX010..EX016]
  const m=String(s).match(/EX(\d+)\s*-\s*0*(\d+)/);if(!m)return String(s).split('/').map(x=>x.trim());
  const a=+m[1],b=+m[2],out=[];for(let i=a;i<=b;i++)out.push('EX'+String(i).padStart(3,'0'));return out;
}
function checklistCard(title,items,sub){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="exhead"><div><div class="exname">${title}</div>
    ${sub?`<div class="exmeta">${sub}</div>`:''}</div></div>`;
  const wrap=document.createElement('div');wrap.style.marginTop='6px';
  items.forEach(x=>{
    const row=document.createElement('div');row.className='listitem';
    row.innerHTML=`<button class="smalltick"></button>
      <div class="li-body"><div class="li-name">${x['動作名稱']}</div>
      <div class="li-sub">${x['預設次數']||''}${x['設備需求']?'・'+x['設備需求']:''}</div></div>
      ${videoBtn(x)}`;
    row.querySelector('.smalltick').onclick=e=>e.currentTarget.classList.toggle('done');
    wrap.appendChild(row);
  });
  c.appendChild(wrap);return c;
}
function videoBtn(x){
  const u=x['YouTube連結'];
  return `<a class="playbtn${u?'':' off'}" href="${u||'#'}" target="_blank" rel="noopener" aria-label="示範影片">▶</a>`;
}

function exerciseCard(planRow){
  const {id}=pickRotation(planRow);
  const x=lib(id);
  const seg=planRow['段位']||'';
  const isPlus=seg.includes('+1')||seg==='選做';
  const reps=String(planRow['次數']).includes('/')
    ? String(planRow['次數']).split('/')[String(planRow['動作ID']).split('/').map(s=>s.trim()).indexOf(id)]?.trim()||planRow['次數']
    : planRow['次數'];
  const nSets=parseInt(planRow['組數'])||3;
  const [lo,hi]=repBounds(reps);
  const last=lastSession(id);
  // 進步判定
  let progress=false, base=x['建議重量kg']||'';
  if(last){
    base=last.sets[0]['重量kg'];
    const full=last.sets.length>=nSets&&last.sets.every(s=>+s['次數']>=hi);
    if(full){progress=true;base=(+last.sets[0]['重量kg']||0)+increment(id);}
  }
  const c=document.createElement('div');c.className='card';c.dataset.exid=id;
  const lastTxt=last?`上次 ${last.sets.map(s=>s['次數']).join('/')} @ ${last.sets[0]['重量kg']}kg`:'第一次記錄';
  c.innerHTML=`
    <div class="exhead"><div>
      <div class="exname">${x['動作名稱']||id}</div>
      <div class="exmeta">${nSets}×${reps}・${x['計重方式']||''}・休 ${planRow['組間休息']||'-'}</div>
    </div><span class="tag${isPlus?' wist':''}">${isPlus?'+1 可跳過':seg}</span></div>
    <div class="hint${progress?' up':''}">${progress?`上次 ${nSets}×${hi} 全達標 ✓ 今天試 ${base}kg`:lastTxt+`・目標:各組推向 ${hi}`}</div>
    <div class="sets"></div>
    <div class="exnote"><input placeholder="備註(器材被佔/不合身/換替補…)" class="exnote-in"></div>
    ${videoRow(x)}`;
  const setsBox=c.querySelector('.sets');
  for(let i=1;i<=nSets;i++){
    const prevSet=last?last.sets[i-1]:null;
    const w=progress?base:(prevSet?prevSet['重量kg']:base);
    const rp=progress?lo:(prevSet?prevSet['次數']:lo);
    const row=document.createElement('div');row.className='set';
    row.innerHTML=`<div class="setn">${i}</div>
      <input type="number" inputmode="decimal" step="0.5" value="${w}" aria-label="重量">
      <input type="number" inputmode="numeric" value="${rp}" aria-label="次數">
      <button class="tick" aria-label="完成這組">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`;
    row._prefill={w:String(w),r:String(rp)};
    row.querySelector('.tick').onclick=()=>logSet(c,row,i,id,x['動作名稱']);
    setsBox.appendChild(row);
  }
  return c;
}
function videoRow(x){
  return x['YouTube連結']?`<div style="margin-top:8px"><a class="playbtn" style="width:auto;padding:0 12px;height:30px;font-size:12px" href="${x['YouTube連結']}" target="_blank" rel="noopener">▶ 示範影片</a></div>`:'';
}
async function logSet(card,row,n,id,name){
  const t=row.querySelector('.tick');
  if(t.classList.contains('done'))return; // 不重複送
  const [wIn,rIn]=row.querySelectorAll('input');
  if(!wIn.value||!rIn.value){toast('先填重量和次數');return;}
  t.classList.add('done');
  const asPre=(wIn.value===row._prefill.w&&rIn.value===row._prefill.r)?'Y':'N';
  const rec={'日期':todayStr(),'動作ID':id,'動作名稱':name,'第幾組':n,
    '重量kg':+wIn.value,'次數':+rIn.value,'照預填(Y/N)':asPre,
    '備註':card.querySelector('.exnote-in').value.trim()};
  DB.logs.push(rec);localStorage.setItem(LS+'db',JSON.stringify(DB));
  await post({action:'log',rows:[rec]});
}

/* ================= 恢復 ================= */
let recMode='auto';
function renderRecover(){
  const chipsW=document.getElementById('recchips');chipsW.innerHTML='';
  const modes=[['auto','今日對應'],['圓肩','圓肩'],['骨盆前傾','骨盆前傾'],['扁平足','扁平足'],['睡前拉伸','睡前']];
  modes.forEach(([k,label])=>{
    const b=document.createElement('button');b.className='chip wist'+(recMode===k?' on':'');b.textContent=label;
    b.onclick=()=>{recMode=k;renderRecover();};chipsW.appendChild(b);
  });
  const body=document.getElementById('rec-body');body.innerHTML='';
  if(recMode==='auto'){
    const opening=DB.library.filter(x=>x['目標部位']==='固定開場');
    body.appendChild(checklistCard('晚間開場',opening,'每式 60 秒'));
    const part=dayType==='腿日'?'下肢日':(dayType==='休息日'?null:'上肢日');
    if(part){
      body.appendChild(checklistCard(part+'收操',DB.library.filter(x=>x['目標部位']===part),'對應今天的訓練'));
    }else{
      body.appendChild(checklistCard('日常拉伸',DB.library.filter(x=>x['動作類型']==='日常拉伸'),'休息日輕鬆做'));
    }
  }else{
    const items=DB.library.filter(x=>x['目標部位']===recMode||x['動作類型']===recMode);
    body.appendChild(checklistCard(recMode==='睡前拉伸'?'睡前拉伸(床上)':recMode+'矯正',items,''));
  }
}

/* ================= 動作庫 ================= */
let libFilter='全部';
function renderLibChips(){
  const cats=['全部','訓練','熱身','核心','居家','晚間恢復','睡前拉伸','日常拉伸'];
  const w=document.getElementById('libchips');w.innerHTML='';
  cats.forEach(c=>{const b=document.createElement('button');
    b.className='chip'+(libFilter===c?' on':'');b.textContent=c;
    b.onclick=()=>{libFilter=c;renderLibChips();renderLib();};w.appendChild(b);});
}
function renderLib(){
  const q=(document.getElementById('libsearch').value||'').toLowerCase();
  const body=document.getElementById('lib-body');body.innerHTML='';
  const items=DB.library.filter(x=>
    (libFilter==='全部'||x['動作類型']===libFilter)&&
    (!q||String(x['動作名稱']).toLowerCase().includes(q)||String(x['目標部位']).toLowerCase().includes(q)));
  if(!items.length){body.innerHTML='<div class="empty">沒有符合的動作</div>';return;}
  items.forEach(x=>{
    const row=document.createElement('div');row.className='listitem';
    row.innerHTML=`<div class="li-body"><div class="li-name">${x['動作名稱']}</div>
      <div class="li-sub">${x['動作類型']}・${x['目標部位']}${x['預設組數']?'・'+x['預設組數']+'×'+x['預設次數']:''}${x['備註']?'・'+x['備註']:''}</div></div>
      ${videoBtn(x)}`;
    body.appendChild(row);
  });
}
function renderNotes(){
  const box=document.getElementById('notes-body');box.innerHTML='';
  let cat='';
  DB.notes.forEach(n=>{
    if(n['分類']!==cat){cat=n['分類'];const h=document.createElement('div');h.className='notecat';h.textContent=cat;box.appendChild(h);}
    const d=document.createElement('div');d.className='noteline';d.textContent=n['規則'];box.appendChild(d);
  });
}

/* ================= 儀表板 ================= */
function renderDash(){
  const ci=DB.checkins.filter(c=>c['早晨體重kg']).sort((a,b)=>a['日期'].localeCompare(b['日期']));
  // KPI
  const ma=movingAvg(ci.map(c=>+c['早晨體重kg']),7);
  const curW=ma.length?ma[ma.length-1].toFixed(1):'–';
  const weekDates=[...new Set(DB.logs.map(l=>l['日期']))].filter(d=>d>=isoDaysAgo(6));
  const wkKcal=avg(DB.checkins.filter(c=>c['日期']>=isoDaysAgo(6)&&c['估計熱量kcal']).map(c=>+c['估計熱量kcal']));
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><b>${curW}</b><span>體重 7日均</span></div>
    <div class="kpi"><b>${weekDates.length}<small style="font-size:12px;color:var(--muted)">/3</small></b><span>本週訓練</span></div>
    <div class="kpi"><b>${wkKcal?Math.round(wkKcal):'–'}</b><span>本週均 kcal</span></div>`;
  // 體重圖
  mkChart('c-weight',{type:'line',data:{labels:ci.map(c=>c['日期'].slice(5)),datasets:[
    {label:'體重',data:ci.map(c=>+c['早晨體重kg']),borderColor:'#C9D3C6',backgroundColor:'#C9D3C6',pointRadius:2,borderWidth:1.5,tension:.3},
    {label:'7日均線',data:ma,borderColor:'#6E8468',pointRadius:0,borderWidth:2.5,tension:.35},
    {label:'目標 60',data:ci.map(()=>60),borderColor:'#A99BC4',borderDash:[5,5],pointRadius:0,borderWidth:1.5}
  ]},options:baseOpt()});
  // 力量圖
  const strengthSets={};
  DB.logs.forEach(l=>{if(!INDICATORS.includes(l['動作ID']))return;
    const k=l['動作ID'];(strengthSets[k]=strengthSets[k]||{})[l['日期']]=Math.max(strengthSets[k][l['日期']]||0,+l['重量kg']||0);});
  const allDates=[...new Set(DB.logs.map(l=>l['日期']))].sort();
  const palette=['#6E8468','#9CAF97','#A99BC4','#7A6C99','#D9A96B','#8B948B','#B7C7B2'];
  const ds=Object.entries(strengthSets).map(([id,m],i)=>({label:(lib(id)['動作名稱']||id).replace('啞鈴','').replace('Cable',''),
    data:allDates.map(d=>m[d]??null),spanGaps:true,borderColor:palette[i%7],pointRadius:2.5,borderWidth:2,tension:.25}));
  mkChart('c-strength',{type:'line',data:{labels:allDates.map(d=>d.slice(5)),datasets:ds},
    options:baseOpt(ds.length?{legend:{display:true,position:'bottom',labels:{boxWidth:8,font:{size:10}}}}:null)});
  // 出席
  const byWeek={};[...new Set(DB.logs.map(l=>l['日期']))].forEach(d=>{const w=isoWeek(d);byWeek[w]=(byWeek[w]||0)+1;});
  const wk=Object.keys(byWeek).sort();
  mkChart('c-attend',{type:'bar',data:{labels:wk,datasets:[
    {label:'訓練次數',data:wk.map(w=>byWeek[w]),backgroundColor:'#9CAF97',borderRadius:6},
    {label:'目標 3',type:'line',data:wk.map(()=>3),borderColor:'#A99BC4',borderDash:[5,5],pointRadius:0,borderWidth:1.5}
  ]},options:baseOpt(null,{suggestedMax:4})});
  // 飲食
  const byWeekK={},byWeekP={};
  DB.checkins.forEach(c=>{if(!c['估計熱量kcal'])return;const w=isoWeek(c['日期']);
    (byWeekK[w]=byWeekK[w]||[]).push(+c['估計熱量kcal']);
    if(c['估計蛋白質g'])(byWeekP[w]=byWeekP[w]||[]).push(+c['估計蛋白質g']);});
  const fw=Object.keys(byWeekK).sort();
  mkChart('c-food',{data:{labels:fw,datasets:[
    {type:'bar',label:'週均 kcal',data:fw.map(w=>Math.round(avg(byWeekK[w]))),backgroundColor:'#C9D3C6',borderRadius:6,yAxisID:'y'},
    {type:'line',label:'目標 1700',data:fw.map(()=>1700),borderColor:'#6E8468',borderDash:[5,5],pointRadius:0,borderWidth:1.5,yAxisID:'y'},
    {type:'line',label:'週均蛋白 g',data:fw.map(w=>byWeekP[w]?Math.round(avg(byWeekP[w])):null),borderColor:'#A99BC4',pointRadius:2.5,borderWidth:2,yAxisID:'y2'}
  ]},options:Object.assign(baseOpt({legend:{display:true,position:'bottom',labels:{boxWidth:8,font:{size:10}}}}),
    {scales:{y:{grid:{color:'#EEF1EC'}},y2:{position:'right',grid:{display:false},suggestedMin:60,suggestedMax:140}}})});
}
function mkChart(id,cfgObj){
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(document.getElementById(id),Object.assign({options:{}},cfgObj));
}
function baseOpt(plugins,yExtra){
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:Object.assign({legend:{display:false}},plugins||{}),
    scales:{x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:8}},
      y:Object.assign({grid:{color:'#EEF1EC'},ticks:{font:{size:10}}},yExtra||{})}};
}
function movingAvg(arr,n){return arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-n+1),i+1);return +(s.reduce((a,b)=>a+b,0)/s.length).toFixed(2);});}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function isoDaysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});}
function isoWeek(ds){const d=new Date(ds+'T00:00:00');const t=new Date(d.valueOf());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);
  const wn=1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7);
  return `${String(t.getFullYear()).slice(2)}w${String(wn).padStart(2,'0')}`;}
</script>
